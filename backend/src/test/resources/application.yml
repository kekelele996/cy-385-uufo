server:
  port: 0
spring:
  datasource:
    url: jdbc:h2:mem:allergy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: test_secret_key_for_allergy_closed_loop
